# ============================================================
# Application
# ============================================================

spring.application.name=auth
server.port=8081

# ============================================================
# PostgreSQL
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/users}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aiworkbench}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aiworkbench}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ============================================================
# Flyway
# ============================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public

# IMPORTANT: isolate auth migrations
spring.flyway.table=flyway_schema_history_auth
spring.flyway.baseline-on-migrate=true

# ============================================================
# Internal Service URLs
# ============================================================

services.auth.base-url=${SERVICES_AUTH_BASE_URL:http://auth:8081}

# ============================================================
# Spring Boot Actuator (MATCH PROJECT STANDARD)
# ============================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.defaults.enabled=true

# useful for readiness/liveness (K8s + Consul consistency)
management.endpoint.health.probes.enabled=true

# ============================================================
# Consul (ALIGNED WITH PROJECT STYLE)
# ============================================================

spring.cloud.consul.host=${CONSUL_HOST:consul}
spring.cloud.consul.port=8500

spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true

spring.cloud.consul.discovery.service-name=${spring.application.name}
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.uuid}

spring.cloud.consul.discovery.hostname=auth
spring.cloud.consul.discovery.prefer-ip-address=false

# Health check monitored by Consul
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s

# Startup resilience (same as project)
spring.cloud.consul.discovery.fail-fast=false
spring.cloud.consul.discovery.retry.max-attempts=10
spring.cloud.consul.discovery.retry.max-interval=5000

# ============================================================
# Logging (aligned baseline)
# ============================================================

logging.level.root=INFO
logging.level.org.springframework.cloud.consul=INFO
logging.level.org.springframework.web=INFO

# ============================================================
# OpenAPI / Swagger (optional but consistent ecosystem-wide)
# ============================================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true