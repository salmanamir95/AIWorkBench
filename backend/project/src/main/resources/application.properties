spring.application.name=project
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/projects}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aiworkbench}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aiworkbench}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public

services.project.base-url=${SERVICES_PROJECT_BASE_URL:http://localhost:8080}

# Consul registration settings
spring.cloud.consul.host=${CONSUL_HOST:consul}
spring.cloud.consul.port=8500
spring.cloud.consul.discovery.register=true
spring.cloud.consul.discovery.prefer-ip-address=true
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.value}

# Health check (Consul monitors this endpoint)
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s