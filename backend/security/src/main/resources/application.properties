# ============================================================
# Application
# ============================================================

spring.application.name=security
server.port=8082

# ============================================================
# PostgreSQL
# ============================================================

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://postgres:5432/security}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aiworkbench}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aiworkbench}
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================================
# JPA / Hibernate
# ============================================================

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false

# ============================================================
# Flyway
# ============================================================

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public

# Security-specific migration history table
spring.flyway.table=flyway_schema_history_security
spring.flyway.baseline-on-migrate=true

# ============================================================
# Internal Service URLs
# ============================================================

services.security.base-url=${SERVICES_SECURITY_BASE_URL:http://security:8082}

# ============================================================
# Spring Boot Actuator
# ============================================================

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always

# This ensures Consul sees the service as UP
management.health.defaults.enabled=true

# ============================================================
# Consul
# ============================================================

spring.cloud.consul.host=${CONSUL_HOST:consul}
spring.cloud.consul.port=8500

spring.cloud.consul.discovery.enabled=true
spring.cloud.consul.discovery.register=true

spring.cloud.consul.discovery.service-name=${spring.application.name}
spring.cloud.consul.discovery.instance-id=${spring.application.name}:${random.uuid}

spring.cloud.consul.discovery.hostname=security
spring.cloud.consul.discovery.prefer-ip-address=false

# Health check endpoint monitored by Consul
spring.cloud.consul.discovery.health-check-path=/actuator/health
spring.cloud.consul.discovery.health-check-interval=10s

# Startup resilience
spring.cloud.consul.discovery.fail-fast=false
spring.cloud.consul.discovery.retry.max-attempts=10
spring.cloud.consul.discovery.retry.max-interval=5000

# ============================================================
# Logging
# ============================================================

logging.level.root=INFO
logging.level.org.springframework.cloud.consul=INFO
logging.level.org.springframework.web=INFO

# ============================================================
# OpenAPI / Swagger
# ============================================================

springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true