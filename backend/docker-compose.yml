services:
  consul:
    image: hashicorp/consul:latest
    container_name: consul
    command: agent -dev -client 0.0.0.0
    ports:
      - "8500:8500"
    networks:
      - workbench-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8500/v1/status/leader"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiworkbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiworkbench}
      POSTGRES_DB: ${POSTGRES_DB:-aiworkbench}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - workbench-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  gateway:
    build: ./gateway
    container_name: gateway
    ports:
      - "8083:8080"
    environment:
      - SPRING_CLOUD_CONSUL_HOST=consul
      - SPRING_CLOUD_CONSUL_DISCOVERY_ENABLED=true
    networks:
      - workbench-network
    depends_on:
      consul:
        condition: service_healthy

  project:
    build: ./project
    container_name: project
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-aiworkbench}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-aiworkbench}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aiworkbench}
      SPRING_CLOUD_CONSUL_HOST: consul
    networks:
      - workbench-network
    depends_on:
      postgres:
        condition: service_healthy
      consul:
        condition: service_healthy
    ports:
      - "8084:8080"

volumes:
  postgres_data:

networks:
  workbench-network:
    driver: bridge