
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-aiworkbench}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-aiworkbench}
      POSTGRES_DB: ${POSTGRES_DB:-aiworkbench}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ai:
    build: ./ai
    ports:
      - "8081:8080"
    restart: unless-stopped
  auth:
    build: ./auth
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-aiworkbench}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aiworkbench}
      LOGGING_LEVEL_ROOT: DEBUG
      LOGGING_LEVEL_ORG_HIBERNATE: DEBUG
      LOGGING_LEVEL_ORG_FLYWAYDB: DEBUG
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8082:8080"
    restart: unless-stopped
  gateway:
    build: ./gateway
    ports:
      - "8083:8080"
    restart: unless-stopped
  project:
    build: ./project
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/project_db
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-aiworkbench}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aiworkbench}
      SERVICES_PROJECT_BASE_URL: http://project:8080
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8084:8080"
    restart: unless-stopped
  security:
    build: ./security
    ports:
      - "8085:8080"
    restart: unless-stopped
  task:
    build: ./task
    ports:
      - "8086:8080"
    restart: unless-stopped
  user:
    build: ./user
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/users
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-aiworkbench}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-aiworkbench}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8087:8080"
    restart: unless-stopped

volumes:
  postgres_data:
