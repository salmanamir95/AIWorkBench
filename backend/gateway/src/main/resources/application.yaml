server:
  port: 8080

spring:
  application:
    name: gateway-service

  main:
    web-application-type: reactive

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/user/**
          filters:

            - name: CircuitBreaker
              args:
                name: userServiceCB
                fallbackUri: forward:/fallback/user

            - name: Retry
              args:
                retries: 2
                methods: GET
                statuses: BAD_GATEWAY, SERVICE_UNAVAILABLE, INTERNAL_SERVER_ERROR
                backoff:
                  firstBackoff: 100ms
                  maxBackoff: 500ms
                  factor: 2

            - StripPrefix=0
            - AddResponseHeader=X-Gateway, active

    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        register: true
        health-check-path: /actuator/health
        health-check-interval: 1s

    httpclient:
      connect-timeout: 2000
      response-timeout: 3s

resilience4j:
  circuitbreaker:
    instances:
      userServiceCB:
        slidingWindowSize: 10
        minimumNumberOfCalls: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 15s
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true

logging:
  level:
    root: INFO

    # Gateway tracing
    org.springframework.cloud.gateway: TRACE
    org.springframework.cloud.gateway.route: TRACE
    org.springframework.cloud.gateway.handler: DEBUG
    org.springframework.cloud.gateway.filter: TRACE

    io.opentelemetry: DEBUG
    io.opentelemetry.exporter: DEBUG

    # Load Balancer
    org.springframework.cloud.loadbalancer: DEBUG

    # Reactor Netty
    reactor.netty: DEBUG
    reactor.netty.http.client: DEBUG
    reactor.netty.http.server: DEBUG

    # Consul
    org.springframework.cloud.consul: DEBUG

    # Reactive HTTP
    org.springframework.http.server.reactive: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} | %-5level | service=gateway-service | traceId=%X{traceId} | %logger - %msg%n"

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus

  endpoint:
    health:
      show-details: always
    prometheus:
      access: unrestricted

  metrics:
    tags:
      application: ${spring.application.name}

  prometheus:
    metrics:
      export:
        enabled: true

