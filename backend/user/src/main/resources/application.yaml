server:
  port: 8081

spring:
  application:
    name: user-service

  main:
    web-application-type: servlet

  jackson:
    serialization:
      indent_output: true

  cloud:
    consul:
      host: localhost
      port: 8500
      discovery:
        enabled: true
        register: true
        health-check-path: /actuator/health
        health-check-interval: 1s

  datasource:
    url: jdbc:postgresql://localhost:5432/aiworkbench_user_db
    username: aiworkbench_user_usr
    password: 123456
  
  jpa:
    hibernate:
      # Change from 'validate' to 'none' or 'update' to allow startup
      # 'none' is best practice when using Flyway
      ddl-auto: none 
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  
  flyway:
    enabled: true
    # This ensures Flyway marks existing schemas as 'baseline' 
    # instead of crashing when it sees tables it didn't create
    baseline-on-migrate: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus,gateway,routes

  endpoint:
    health:
      show-details: always

  metrics:
    tags:
      application: ${spring.application.name}

  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    root: INFO
    # --- Flyway Migration (Verbose) ---
    org.flywaydb: DEBUG

    # --- Hibernate & JPA (Verbose) ---
    # Log the actual SQL statements executed
    org.hibernate.SQL: DEBUG
    # Log the parameters passed into SQL queries
    org.hibernate.orm.jdbc.bind: TRACE
    # Log schema validation and tool actions (essential for your error)
    org.hibernate.tool.schema: DEBUG
    # Log JPA initialization
    org.springframework.orm.jpa: DEBUG
    
    # --- Existing Debuggers ---
    org.springframework.web: DEBUG
    org.springframework.web.servlet: DEBUG
    org.springframework.cloud.consul: DEBUG
    org.springframework.security: DEBUG
    io.opentelemetry: DEBUG

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} | %-5level | service=user-service | traceId=%X{traceId} | %logger - %msg%n"

