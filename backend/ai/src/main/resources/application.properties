spring.application.name=ai
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/ai_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:aiworkbench}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:aiworkbench}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.default-schema=public
spring.flyway.schemas=public
